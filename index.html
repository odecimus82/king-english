<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>King English 单词特训</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --bg-color: #f5f7fa;
            --card-bg: #ffffff;
            --text-color: #333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
            position: relative; /* 为返回按钮定位 */
        }

        h1 { margin-top: 0; color: var(--primary-color); font-size: 24px; }

        /* 菜单区域 */
        #menu-area { display: block; }
        
        .mode-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .mode-btn:active { transform: scale(0.98); }

        /* 练习区域 */
        #practice-area { display: none; }

        /* 返回按钮样式 */
        .back-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #eee;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 14px;
            color: #666;
            cursor: pointer;
        }

        .word-card {
            font-size: 28px;
            font-weight: bold;
            margin: 20px 0;
            min-height: 40px;
        }

        /* 发音按钮 */
        .speak-btn {
            background: none;
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 20px;
            cursor: pointer;
            margin-left: 10px;
            vertical-align: middle;
        }

        input[type="text"] {
            width: 80%;
            padding: 12px;
            font-size: 18px;
            border: 2px solid #ddd;
            border-radius: 8px;
            margin-bottom: 15px;
            outline: none;
            text-align: center;
        }

        input[type="text"]:focus { border-color: var(--primary-color); }

        .feedback {
            height: 20px;
            font-size: 14px;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .correct { color: #2ecc71; }
        .wrong { color: #e74c3c; }

        .stats {
            margin-top: 20px;
            font-size: 14px;
            color: #666;
            display: flex;
            justify-content: space-around;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 主菜单 -->
    <div id="menu-area">
        <h1>King English</h1>
        <p>选择练习模式</p>
        <button class="mode-btn" onclick="startPractice('cet4')">四级核心词</button>
        <button class="mode-btn" onclick="startPractice('cet6')">六级核心词</button>
        <button class="mode-btn" onclick="startPractice('kaoyan')">考研必考词</button>
    </div>

    <!-- 练习界面 -->
    <div id="practice-area">
        <!-- 修复2：添加返回按钮 -->
        <button class="back-btn" onclick="goBack()">← 返回</button>
        
        <div class="stats">
            <span id="progress">进度: 0/0</span>
            <span id="score">得分: 0</span>
        </div>

        <div style="margin-top: 30px;">
            <!-- 单词显示区域 -->
            <div id="question-text" class="word-card">Loading...</div>
            
            <!-- 修复1：添加显式的发音按钮 -->
            <div style="margin-bottom: 15px;">
                <button class="speak-btn" onclick="playCurrentAudio()">🔊</button>
                <span style="font-size: 12px; color: #999; display: block; margin-top: 5px;">点喇叭听发音</span>
            </div>
        </div>

        <div class="feedback" id="feedback-msg"></div>

        <input type="text" id="user-input" placeholder="输入中文或英文" autocomplete="off">
    </div>
</div>

<script>
    // 词库数据 (示例数据，你可以替换为之前的完整数据)
    const wordData = {
        cet4: [
            { en: "abandon", zh: "放弃" },
            { en: "ability", zh: "能力" },
            { en: "normal", zh: "正常的" },
            { en: "abroad", zh: "在国外" }
        ],
        cet6: [
            { en: "abnormal", zh: "反常的" },
            { en: "abolish", zh: "废除" }
        ],
        kaoyan: [
            { en: "academic", zh: "学术的" },
            { en: "academy", zh: "学院" }
        ]
    };

    let currentList = [];
    let currentIndex = 0;
    let score = 0;
    let isEnglishToChinese = true; // 默认为英译中
    let currentWord = null;

    // 语音合成初始化
    const synth = window.speechSynthesis;

    // 修复1：开始练习时，尝试“解锁”音频上下文（针对iOS）
    function startPractice(mode) {
        currentList = wordData[mode] || wordData['cet4'];
        // 乱序
        currentList.sort(() => Math.random() - 0.5);
        
        currentIndex = 0;
        score = 0;

        document.getElementById('menu-area').style.display = 'none';
        document.getElementById('practice-area').style.display = 'block';
        
        // 尝试播放一个空音，激活手机浏览器的语音功能
        const u = new SpeechSynthesisUtterance("");
        synth.speak(u);

        loadQuestion();
    }

    // 修复2：返回主菜单功能
    function goBack() {
        document.getElementById('practice-area').style.display = 'none';
        document.getElementById('menu-area').style.display = 'block';
        // 清空输入框
        document.getElementById('user-input').value = '';
    }

    function loadQuestion() {
        if (currentIndex >= currentList.length) {
            alert(`练习结束！最终得分: ${score}`);
            goBack();
            return;
        }

        currentWord = currentList[currentIndex];
        // 随机决定是“英译中”还是“中译英”
        isEnglishToChinese = Math.random() > 0.5;

        const qText = document.getElementById('question-text');
        const input = document.getElementById('user-input');
        const feedback = document.getElementById('feedback-msg');

        feedback.textContent = '';
        feedback.className = 'feedback';
        input.value = '';
        input.focus();

        // 更新进度
        document.getElementById('progress').textContent = `进度: ${currentIndex + 1}/${currentList.length}`;
        document.getElementById('score').textContent = `得分: ${score}`;

        if (isEnglishToChinese) {
            // 显示英文，考中文
            qText.textContent = currentWord.en;
            // 自动播放发音（手机端可能被拦截，所以保留了手动按钮）
            playCurrentAudio();
        } else {
            // 显示中文，考英文
            qText.textContent = currentWord.zh;
        }
    }

    // 播放当前单词发音
    function playCurrentAudio() {
        if (!currentWord) return;
        // 无论当前考中文还是英文，发音总是读英文单词
        const utterance = new SpeechSynthesisUtterance(currentWord.en);
        utterance.lang = 'en-US'; // 设置为美式英语
        utterance.rate = 0.9; // 语速稍慢
        synth.cancel(); // 停止之前的发音
        synth.speak(utterance);
    }

    // 监听输入
    document.getElementById('user-input').addEventListener('input', function(e) {
        const val = e.target.value.trim();
        if (!val) return;

        let correct = false;
        
        if (isEnglishToChinese) {
            // 英文->中文：包含核心字即可
            if (currentWord.zh.includes(val) && val.length >= 1) {
                // 简单的模糊匹配，实际可根据需要严格化
                if (val === currentWord.zh) correct = true;
            }
        } else {
            // 中文->英文：必须完全匹配（忽略大小写）
            if (val.toLowerCase() === currentWord.en.toLowerCase()) {
                correct = true;
            }
        }

        if (correct) {
            handleCorrect();
        }
    });

    function handleCorrect() {
        const feedback = document.getElementById('feedback-msg');
        feedback.textContent = '✅ 回答正确!';
        feedback.className = 'feedback correct';
        score += 10;
        document.getElementById('score').textContent = `得分: ${score}`;
        
        // 播放发音巩固
        playCurrentAudio();

        // 修复3：自动跳转逻辑
        // 禁用输入框防止重复提交
        document.getElementById('user-input').disabled = true;
        
        setTimeout(() => {
            currentIndex++;
            document.getElementById('user-input').disabled = false;
            loadQuestion();
        }, 1200); // 1.2秒后跳转下一题
    }

</script>

</body>
</html>
