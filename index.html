<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>King English 单词特训</title>
    <style>
        :root {
            --gold: #dcb066;
            --gold-light: #f5dcb0;
            --blue-dark: #121826;
            --blue-panel: #1c2638;
            --btn-bg: linear-gradient(180deg, #3a4b68, #232d42);
        }

        body {
            font-family: "Microsoft YaHei", sans-serif;
            background-color: var(--blue-dark);
            color: var(--gold-light);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            /* 游戏背景纹理 */
            background-image: radial-gradient(circle at 50% 30%, #2a3a55 0%, #121826 70%);
        }

        /* 顶部标题栏 */
        .header {
            width: 100%;
            padding: 15px 0;
            text-align: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            border-bottom: 1px solid rgba(220, 176, 102, 0.3);
        }

        h1 {
            margin: 0;
            font-size: 24px;
            color: var(--gold);
            text-shadow: 0 0 10px rgba(220, 176, 102, 0.5);
            letter-spacing: 2px;
        }

        /* 主容器 */
        .container {
            width: 90%;
            max-width: 450px;
            margin-top: 20px;
            position: relative;
        }

        /* 菜单区域 */
        #menu-area {
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 20px;
        }
        
        /* 游戏风格按钮 */
        .game-btn {
            display: block;
            width: 100%;
            padding: 18px;
            background: var(--btn-bg);
            color: var(--gold);
            border: 2px solid var(--gold);
            border-radius: 4px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            text-shadow: 1px 1px 2px black;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            transition: all 0.2s;
        }

        .game-btn::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 50%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.1), transparent);
        }

        .game-btn:active {
            transform: scale(0.95);
            box-shadow: 0 0 5px rgba(220, 176, 102, 0.8);
        }

        /* 练习区域面板 */
        #practice-area {
            display: none;
            background: var(--blue-panel);
            border: 2px solid #4a5c7a;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
        }

        /* 返回按钮（修复点2） */
        .back-btn {
            position: absolute;
            top: -45px;
            left: 0;
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 5px 15px;
            font-size: 14px;
            border-radius: 20px;
            cursor: pointer;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            color: #8fa3c4;
            font-size: 14px;
            margin-bottom: 20px;
            border-bottom: 1px solid #3a4b68;
            padding-bottom: 10px;
        }

        .word-display {
            text-align: center;
            margin: 30px 0;
        }

        .main-word {
            font-size: 32px;
            color: #fff;
            text-shadow: 0 0 10px rgba(74, 144, 226, 0.8);
            margin-bottom: 10px;
            font-family: "Arial", sans-serif;
        }

        /* 发音按钮（修复点1） */
        .speak-btn {
            background: rgba(220, 176, 102, 0.2);
            border: 1px solid var(--gold);
            color: var(--gold);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            margin-top: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        input[type="text"] {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: 1px solid #4a5c7a;
            color: white;
            padding: 15px;
            font-size: 18px;
            text-align: center;
            border-radius: 4px;
            box-sizing: border-box;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--gold);
            box-shadow: 0 0 8px rgba(220, 176, 102, 0.3);
        }

        .feedback {
            text-align: center;
            height: 30px;
            line-height: 30px;
            margin-top: 10px;
            font-weight: bold;
            text-shadow: 0 0 5px black;
        }
        .correct { color: #00ffaa; }
        .wrong { color: #ff4444; }

        /* 装饰性边角 */
        .corner {
            position: absolute;
            width: 10px; height: 10px;
            border: 2px solid var(--gold);
            transition: all 0.3s;
        }
        .tl { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
        .tr { top: -2px; right: -2px; border-left: 0; border-bottom: 0; }
        .bl { bottom: -2px; left: -2px; border-right: 0; border-top: 0; }
        .br { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }

    </style>
</head>
<body>

<div class="header">
    <h1>KING ENGLISH</h1>
</div>

<div class="container">
    <!-- 主菜单 -->
    <div id="menu-area">
        <button class="game-btn" onclick="startPractice('cet4')">
            ⚔️ 四级核心战场
        </button>
        <button class="game-btn" onclick="startPractice('cet6')">
            🛡️ 六级进阶试炼
        </button>
        <button class="game-btn" onclick="startPractice('kaoyan')">
            👑 考研巅峰对决
        </button>
    </div>

    <!-- 练习界面 -->
    <div id="practice-area">
        <div class="corner tl"></div><div class="corner tr"></div>
        <div class="corner bl"></div><div class="corner br"></div>

        <!-- 修复2：返回按钮 -->
        <button class="back-btn" onclick="goBack()">❮ 撤退</button>

        <div class="stats-bar">
            <span id="progress">WAVE: 1/10</span>
            <span id="score">GOLD: 0</span>
        </div>

        <div class="word-display">
            <div id="question-text" class="main-word">Loading...</div>
            
            <!-- 修复1：发音按钮 -->
            <button class="speak-btn" onclick="playCurrentAudio()">🔊</button>
        </div>

        <input type="text" id="user-input" placeholder="输入答案..." autocomplete="off">
        
        <div class="feedback" id="feedback-msg"></div>
    </div>
</div>

<script>
    // 词库数据
    const wordData = {
        cet4: [
            { en: "abandon", zh: "放弃" }, { en: "ability", zh: "能力" },
            { en: "absolute", zh: "绝对的" }, { en: "abroad", zh: "在国外" },
            { en: "absorb", zh: "吸收" }, { en: "abstract", zh: "抽象的" }
        ],
        cet6: [
            { en: "abnormal", zh: "反常的" }, { en: "abolish", zh: "废除" },
            { en: "abrupt", zh: "突然的" }, { en: "absurd", zh: "荒谬的" }
        ],
        kaoyan: [
            { en: "academic", zh: "学术的" }, { en: "academy", zh: "学院" },
            { en: "accelerate", zh: "加速" }, { en: "access", zh: "入口" }
        ]
    };

    let currentList = [];
    let currentIndex = 0;
    let score = 0;
    let isEnglishToChinese = true;
    let currentWord = null;
    const synth = window.speechSynthesis;

    // 启动练习
    function startPractice(mode) {
        currentList = wordData[mode] || wordData['cet4'];
        currentList.sort(() => Math.random() - 0.5); // 乱序
        currentIndex = 0;
        score = 0;

        document.getElementById('menu-area').style.display = 'none';
        document.getElementById('practice-area').style.display = 'block';
        
        // 激活音频上下文
        const u = new SpeechSynthesisUtterance("");
        synth.speak(u);

        loadQuestion();
    }

    // 返回菜单
    function goBack() {
        document.getElementById('practice-area').style.display = 'none';
        document.getElementById('menu-area').style.display = 'flex';
        document.getElementById('user-input').value = '';
    }

    // 加载题目
    function loadQuestion() {
        if (currentIndex >= currentList.length) {
            alert(`VICTORY! \n最终战绩: ${score}`);
            goBack();
            return;
        }

        currentWord = currentList[currentIndex];
        isEnglishToChinese = Math.random() > 0.5;

        const qText = document.getElementById('question-text');
        const input = document.getElementById('user-input');
        const feedback = document.getElementById('feedback-msg');

        feedback.textContent = '';
        input.value = '';
        input.disabled = false;
        input.focus();

        document.getElementById('progress').textContent = `WAVE: ${currentIndex + 1}/${currentList.length}`;
        document.getElementById('score').textContent = `GOLD: ${score}`;

        if (isEnglishToChinese) {
            qText.textContent = currentWord.en;
            playCurrentAudio();
        } else {
            qText.textContent = currentWord.zh;
        }
    }

    // 播放音频
    function playCurrentAudio() {
        if (!currentWord) return;
        const utterance = new SpeechSynthesisUtterance(currentWord.en);
        utterance.lang = 'en-US';
        utterance.rate = 0.9;
        synth.cancel();
        synth.speak(utterance);
    }

    // 监听输入
    document.getElementById('user-input').addEventListener('input', function(e) {
        const val = e.target.value.trim();
        if (!val) return;

        let correct = false;
        if (isEnglishToChinese) {
            if (currentWord.zh.includes(val) && val.length >= 1) correct = true;
        } else {
            if (val.toLowerCase() === currentWord.en.toLowerCase()) correct = true;
        }

        if (correct) {
            handleCorrect();
        }
    });

    // 正确处理（修复点3：自动跳转）
    function handleCorrect() {
        const feedback = document.getElementById('feedback-msg');
        feedback.textContent = '⚔️ Pentakill! (正确)';
        feedback.className = 'feedback correct';
        
        score += 100;
        document.getElementById('score').textContent = `GOLD: ${score}`;
        
        playCurrentAudio();

        // 锁定输入框，防止重复输入
        document.getElementById('user-input').disabled = true;

        // 1秒后自动下一题
        setTimeout(() => {
            currentIndex++;
            loadQuestion();
        }, 1000);
    }
</script>

</body>
</html>
